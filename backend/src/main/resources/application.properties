spring.application.name=kanban-backend

# PostgreSQL(docker-compose.yml の db サービス)。値は環境変数で上書きできる。
# パスワードはローカル開発用の固定値であり、本番では使わない。
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanban}
spring.datasource.username=${DB_USER:kanban}
spring.datasource.password=${DB_PASSWORD:kanban}
